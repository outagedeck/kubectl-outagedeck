apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: payments
  annotations:
    outagedeck.com/providers: aws,github,stripe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
    spec:
      containers:
      - name: app
        image: registry.k8s.io/pause:3.10
