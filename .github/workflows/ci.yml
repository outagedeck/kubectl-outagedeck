name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.23.x'
    - run: go test -race ./...
    - run: go vet ./...
    - run: go build ./cmd/kubectl-outagedeck
    - name: Cross-compile release targets
      shell: bash
      run: |
        set -euo pipefail
        for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
          os=${target%/*}
          arch=${target#*/}
          suffix=
          if [ "$os" = windows ]; then suffix=.exe; fi
          GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags '-s -w -X main.version=ci' -o "dist/${os}_${arch}/kubectl-outagedeck${suffix}" ./cmd/kubectl-outagedeck
        done
